version: '3.8'

services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    container_name: habitat_postgres
    environment:
      POSTGRES_USER: habitat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-habitat_dev}
      POSTGRES_DB: habitat_development
    volumes:
      # Named volume for persistent data (survives container restarts)
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Rails API application
  app:
    build: .
    container_name: habitat_app
    # Confirmed necessary, not a leftover: with this removed, the image's
    # non-root `rails` user can't write to log/tmp on the bind-mounted
    # project directory under Windows Docker Desktop (Errno::EACCES on
    # server.pid / development.log), even though it owns those paths inside
    # the image. Revisit if/when this ever runs on a non-Windows host.
    user: root
    command: rails server -b 0.0.0.0
    environment:
      RAILS_ENV: development
      JWT_SECRET: dev_jwt_secret_change_me_in_production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      # Mount the entire project for live code reloading (must match Dockerfile WORKDIR)
      - .:/rails
      # Exclude node_modules and bundle (host versions not needed)
      - /rails/node_modules
      - /rails/vendor/bundle
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
